name: Feature request
description: Propose an improvement for FaultPilot
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    attributes:
      label: Problem
      description: What troubleshooting or monitoring problem should be solved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
