server:
  port: 8080

spring:
  application:
    name: faultpilot
  jackson:
    default-property-inclusion: non_null
  # Internal store for diagnosis reports and ingested events (survives restarts).
  # Defaults to a local H2 file under ./data — no setup needed; override via env if desired.
  datasource:
    url: ${FAULTPILOT_STORE_URL:jdbc:h2:file:./data/faultpilot;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${FAULTPILOT_STORE_USER:sa}
    password: ${FAULTPILOT_STORE_PASSWORD:}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health

# Mock mode, runs out of the box. AI providers and log/DB integration: see docs/getting-started.
faultpilot:
  mode: mock
  ai:
    provider: ${FAULTPILOT_AI_PROVIDER:mock}
  ingestion:
    require-token: true
  projects:
    - id: order-service
      display-name: Order Service
      integration-level: L2
      environments:
        - local
        - staging
      max-query-hours: 24
      max-results: 500
      logs:
        type: mock
