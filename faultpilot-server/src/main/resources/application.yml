server:
  port: 8080

spring:
  application:
    name: faultpilot
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

# Mock mode, runs out of the box. AI providers and log/DB integration: see docs/getting-started.
faultpilot:
  mode: mock
  ai:
    provider: ${FAULTPILOT_AI_PROVIDER:mock}
  ingestion:
    require-token: true
  projects:
    - id: order-service
      display-name: Order Service
      integration-level: L2
      environments:
        - local
        - staging
      max-query-hours: 24
      max-results: 500
      logs:
        type: mock
